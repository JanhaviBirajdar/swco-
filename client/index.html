    <script>
      // Apply theme preference (default to light for clean institutional SaaS)
      (function() {
        const storedTheme = localStorage.getItem('vasuniti-theme') || localStorage.getItem('swco-theme');
        if (storedTheme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
      })();
    </script>
